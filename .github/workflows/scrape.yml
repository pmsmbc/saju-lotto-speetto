name: Scrape Speetto

on:
  schedule:
    - cron: '0 0,6,12 * * *'   # 매일 09:00·15:00·21:00 KST (실제 실행은 2~4시간 지연됨)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 동행복권이 GitHub 러너 IP를 간헐 차단함 → 실패해도 경고만 남기고 성공 처리 (주력은 로컬 launchd)
      - run: node scripts/scrape-speetto.js || echo "::warning::동행복권 접속 실패(러너 IP 차단 추정) — 이번 회차 건너뜀"
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/speetto.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: update speetto 1등 잔여 현황"
            for i in 1 2 3; do
              git push && break
              git pull --rebase
            done
          fi
